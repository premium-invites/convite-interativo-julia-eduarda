(()=>{'use strict';const C=window.CONFIG,$=id=>document.getElementById(id);const allScreens=[...document.querySelectorAll('.screen')];let current='opening',started=false;const EDIT=new URLSearchParams(location.search).get('editor')==='1';if(EDIT)document.body.classList.add('editing');

const r={step:1,nome:'',resposta:'sim',quantidade:'0',nomes:''};function renderRsvp(){const b=$('rsvpBody');if(r.step===1){b.innerHTML=`<div class="step-header">Etapa 1 de 2 — Seus dados</div><label for="guestName">Nome completo *</label><input id="guestName" autocomplete="name" maxlength="90" required placeholder="Digite seu nome"><label for="attend">Você poderá comparecer? *</label><select id="attend"><option value="sim">Sim, confirmo minha presença</option><option value="nao">Não poderei comparecer</option></select>`;$('guestName').value=r.nome;$('attend').value=r.resposta;$('rsvpBack').textContent='Cancelar';$('rsvpNext').textContent='Continuar'}else{b.innerHTML=`<div class="step-header">Etapa 2 de 2 — Revisão</div><p id="reviewText"></p>${r.resposta==='sim'&&C.confirmacao?.permitirAcompanhantes?`<label for="quantity">Quantidade de acompanhantes (sem contar você)</label><input id="quantity" type="number" min="0" max="${C.confirmacao.maxAcompanhantes||10}" value="${r.quantidade}"><label for="names">Nomes dos acompanhantes (opcional)</label><textarea id="names" rows="3" placeholder="Informe os nomes, se aplicável"></textarea>`:''}<p class="hint">Ao continuar, seu WhatsApp será aberto com a mensagem preparada. Confirme o envio no aplicativo.</p>`;$('reviewText').textContent=r.nome+' — '+(r.resposta==='sim'?'Confirmará presença':'Não poderá comparecer');if($('names'))$('names').value=r.nomes;$('rsvpBack').textContent='Voltar';$('rsvpNext').textContent='Abrir WhatsApp'}}

const eventMs=new Date(C.dataEvento).getTime();const pad=n=>String(n).padStart(2,'0');function updateCounter(){const el=$('count'),s=Math.max(0,Math.floor((eventMs-Date.now())/1000));if(!Number.isFinite(s)){el.textContent='Data a confirmar';return}if(s===0){el.innerHTML='<b>A festa começou!</b>';return}const days=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;el.innerHTML=`<div><b>${days}</b><small>dias</small></div><div><b>${pad(h)}</b><small>horas</small></div><div><b>${pad(m)}</b><small>min</small></div><div><b>${pad(sec)}</b><small>seg</small></div>`}updateCounter();setInterval(updateCounter,1000);
